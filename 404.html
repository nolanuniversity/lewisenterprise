<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Lewis School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F5F5F5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-container { text-align: center; padding: 40px; max-width: 600px; }
        .error-code { font-size: 120px; font-weight: 800; color: #C5A028; font-family: 'Playfair Display', serif; }
        .error-title { font-size: 32px; color: #0A1C3A; margin-bottom: 16px; }
        .error-text { color: #666; margin-bottom: 32px; }
        .btn { display: inline-block; background: #0A1C3A; color: white; padding: 12px 28px; border-radius: 4px; text-decoration: none; margin: 0 8px; }
        .btn-gold { background: #C5A028; color: #0A1C3A; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-text">The page you are looking for might have been moved, deleted, or never existed.</p>
        <a href="index.html" class="btn">← Back to Home</a>
        <a href="contact/" class="btn btn-gold">Contact Us</a>
    </div>
</body>
</html>
